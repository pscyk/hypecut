[project]
name = "hypecut"
version = "0.1.0"
description = "Drop a link. Cut the good stuff. YouTube and Twitch to captioned vertical clips."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1.0,<2",
    "av>=11,<17",  # Keep the audio decoder compatible with faster-whisper 1.x.
    "anthropic>=0.40.0,<1",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.31,<3",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "yt-dlp[default]>=2026.3.17",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
service = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Repository = "https://github.com/pscyk/hypecut"
Issues = "https://github.com/pscyk/hypecut/issues"

[project.scripts]
hypecut = "clipper.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.hatch.build.targets.sdist]
only-include = ["clipper", "tests", "docs", "README.md", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".env.example", ".gitignore"]
exclude = ["**/__pycache__", "**/*.pyc"]
